<html lang="he" dir="rtl">
<head>

<title>עורך כתוביות</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#181b22;--fg:#f2f2f2;--mut:#8b93a3;--acc:#ffcc33;--acc2:#4fa3ff;--bar:#12151b;--header-h:52px;--early:#ff9f43;--late:#4fa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Assistant',sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid #262b35;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:13px;color:var(--mut)}
.status.err{color:#ff6b6b}
.hbtn{font:inherit;font-size:14px;background:#262b35;color:var(--fg);border:0;border-radius:8px;padding:6px 10px}
.hbtn.icon{width:36px;height:36px;padding:0;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.hbtn.icon[aria-pressed="true"]{background:var(--acc);color:#111}
.hbtn.submit{background:var(--acc);color:#111;font-weight:800;font-size:16px;padding:8px 18px}
.help{font-size:13px;color:var(--mut);padding:6px 14px 0;line-height:1.45}
.help b{color:var(--fg)}
#lines{padding:8px 8px 90px}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:0;background:var(--card);border-radius:10px;padding:5px 6px 5px 4px;margin:6px 0 0;position:relative;cursor:pointer}
.line.cur{outline:2px solid var(--acc2)}
.num{font-size:11px;color:var(--mut);min-width:22px;text-align:center;align-self:flex-start;padding-top:8px}
.w{display:inline-flex;align-items:center;position:relative}
.wt,.part-btn,.ch{font:inherit;font-size:21px;color:var(--fg);background:none;border:0;padding:4px 3px;border-radius:6px;line-height:1.25;display:inline-block;font-weight:400;transform-origin:center center;transition:transform .16s ease}
.w.now .wt,.part.now .part-btn,.part.now .ch{transform:scale(1.1);background:var(--acc2);color:#fff}
.w.now.marked .wt,.part.now.marked .part-btn,.part.now.marked .ch{transform:scale(1.25);font-weight:800}
.w.sung.marked .wt,.part.sung.marked .part-btn,.part.sung.marked .ch{font-weight:800}
.w.edited{box-shadow:inset 0 -2px 0 rgba(255,204,51,.7)}
.w.hidden-w{opacity:.55}
.w.hidden-w .ghost{font:inherit;font-size:14px;color:var(--mut);padding:4px 6px;background:none;border:0}
.bb{font:inherit;font-size:10px;font-weight:800;width:17px;height:17px;padding:0;border-radius:4px;border:1px solid #3a4150;background:#20242d;color:var(--mut);margin-inline-start:1px;line-height:15px}
.w.marked .bb{background:var(--acc);color:#111;border-color:var(--acc)}
.gap{font:inherit;min-width:34px;height:34px;margin:0 4px;padding:0 5px;border:1.5px solid #3d7fd6;background:#16294a;color:#9cc8ff;font-size:17px;font-weight:800;border-radius:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.gap:active,.gap:hover{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.x{font:inherit;min-width:34px;height:34px;margin:0 4px 0 2px;border-radius:17px;border:1.5px solid #e05555;background:#4a1a1f;color:#ffb3b3;font-size:18px;font-weight:800;line-height:1;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;align-self:center}
.x:active{background:#e05555;color:#fff}
.w.cutword{border:1.5px solid #6b7384;border-radius:8px;padding:1px 3px;margin:1px 2px;align-items:center}
.w.cutword.cont-end{border-inline-end-style:dashed;border-start-end-radius:2px;border-end-end-radius:2px}
.w.cutword.cont-start{border-inline-start-style:dashed;border-start-start-radius:2px;border-end-start-radius:2px}
.part{display:inline-flex;align-items:center}
.cutline{flex:0 0 10px;width:10px;align-self:stretch;padding:0;border:0;background:transparent;position:relative;cursor:pointer}
.cutline::before{content:'';position:absolute;left:50%;top:3px;bottom:3px;width:2px;background:#9cc8ff;transform:translateX(-50%);border-radius:1px}
.cutline.broke::before{background:var(--acc);width:3px}
.addcut{flex:0 0 7px;width:7px;align-self:stretch;padding:0;border:0;background:transparent;position:relative}
.addcut::before{content:'';position:absolute;left:50%;top:4px;bottom:4px;width:1px;background:#3a4150;transform:translateX(-50%)}
.addcut:hover::before,.addcut:active::before{background:var(--acc);width:2px}
.nbtn,.sbtn{position:relative;flex:0 0 26px;width:26px;height:26px;border:0;border-radius:7px;background:transparent;font-size:14px;padding:0;line-height:26px;align-self:center}
.nbtn .dot{position:absolute;top:1px;inset-inline-start:1px;width:7px;height:7px;border-radius:50%;pointer-events:none}
.nbtn.early .dot{background:var(--early)}
.nbtn.late .dot{background:var(--late)}
.nbtn.text{background:#3a3420}
.nbtn.text .dot{background:var(--acc)}
.sbtn{border:1.5px dashed #6b7384;background:transparent}
.sbtn.on{background:#1a1e26;border-color:var(--mut)}
.nmenu{position:absolute;top:100%;right:0;z-index:12;background:#1c2028;border:1px solid #3a4150;border-radius:10px;min-width:148px;padding:4px;direction:rtl;box-shadow:0 8px 24px #0008}
.nmenu button{display:block;width:100%;text-align:right;font:inherit;font-size:15px;background:none;border:0;color:var(--fg);padding:8px 10px;border-radius:6px}
.nmenu button:hover,.nmenu button:active{background:#262b35}
.nmenu .fld{display:flex;gap:4px;padding:4px}
.nmenu input{flex:1;min-width:0;font:inherit;font-size:14px;background:#12151b;color:var(--fg);border:1px solid #3a4150;border-radius:6px;padding:6px 8px}
.nmenu .fld button{width:auto;padding:6px 10px;background:var(--acc);color:#111;font-weight:800}
.wedit{display:inline-flex;align-items:center;gap:4px;background:#12151b;border:1px solid var(--acc2);border-radius:8px;padding:2px 4px;margin:0 2px}
.wedit input{font:inherit;font-size:21px;width:14ch;min-width:6ch;background:transparent;border:0;color:var(--fg);padding:2px 4px;direction:rtl}
.wedit input.warn{box-shadow:inset 0 0 0 1px #ff9f43}
.wedit button{font:inherit;width:28px;height:28px;border:0;border-radius:6px;background:#262b35;color:var(--fg);font-size:16px;font-weight:800;padding:0}
.wedit .we-ok{background:var(--acc);color:#111}
.silence-row{border:1.5px dashed #3a4150;border-radius:10px;height:32px;margin:4px 0 6px;background:#14171c;cursor:pointer}
.player{position:fixed;bottom:0;left:0;right:0;z-index:15;background:var(--bar);border-top:1px solid #262b35;padding:0 8px env(safe-area-inset-bottom);height:calc(52px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;direction:ltr}
.ib{font:inherit;flex:0 0 auto;width:38px;height:38px;border:0;border-radius:50%;background:#262b35;color:var(--fg);font-size:13px;font-weight:700;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ib.main{background:var(--acc2);width:42px;height:42px;font-size:17px}
.ib.on{background:var(--acc);color:#111}
.time{flex:0 0 auto;font-size:12px;color:var(--mut);direction:ltr;min-width:66px;text-align:center}
input[type=range]{flex:1;min-width:40px;direction:ltr;accent-color:var(--acc2);height:4px;margin:0}
.speed{font:inherit;flex:0 0 auto;height:28px;min-width:40px;padding:0 9px;border:0;border-radius:14px;background:#262b35;color:var(--fg);font-size:13px;font-weight:800;line-height:28px}
.speed:not([data-rate="1"]){background:var(--acc);color:#111}
.vwrap{position:fixed;left:8px;top:calc(var(--header-h) + 8px);z-index:10;height:132px;aspect-ratio:480/854;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 4px 16px #000a;display:none}
.vwrap.show{display:block}
.vwrap.big{height:min(50vh,420px)}
video{width:100%;height:100%;display:block;object-fit:contain}
.sub{position:absolute;left:2px;right:2px;bottom:10%;text-align:center;font-size:12px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;direction:rtl;line-height:1.35;font-weight:400}
.vwrap.big .sub{font-size:20px}
.sub .tok{display:inline-block;transform-origin:center center;transition:transform .16s ease;font-weight:400}
.sub .tok.on{color:var(--acc);transform:scale(1.1)}
.sub .tok.b{font-weight:800}
.sub .tok.on.b{font-weight:800;transform:scale(1.25)}
.vbig{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:14px;padding:0}
.err-box{padding:30px;text-align:center;color:#ff8a8a;font-size:18px}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:14px;padding:18px 16px;max-width:420px;width:100%;direction:rtl;font-family:'Assistant',sans-serif;box-shadow:0 8px 32px #000a}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:0 0 12px;color:var(--mut);font-size:15px;line-height:1.5}
.modal .preview{background:#12151b;border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.55;margin-bottom:14px;white-space:pre-wrap}
.modal .actions{display:flex;gap:8px;justify-content:flex-start}
.modal .ok{background:var(--acc);color:#111;font:inherit;font-weight:800;border:0;border-radius:8px;padding:10px 16px}
.modal .cancel{background:#262b35;color:var(--fg);font:inherit;border:0;border-radius:8px;padding:10px 16px}
.snack{position:fixed;left:8px;right:8px;bottom:calc(60px + env(safe-area-inset-bottom));z-index:16;background:#2a2f3a;color:var(--fg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;direction:rtl;font-size:14px;line-height:1.4;box-shadow:0 8px 24px #0008}
.snack span{flex:1;min-width:0}
.snack button{font:inherit;font-weight:800;border:0;background:var(--acc);color:#111;border-radius:8px;padding:6px 12px;flex:0 0 auto}

.w.has-fx{box-shadow:inset 0 -2px 0 #7ecbff}
.fx-badge{font-size:11px;line-height:1;margin:0 1px;align-self:flex-start;padding-top:2px}
.sheet-bg{position:fixed;inset:0;background:#0008;z-index:25}
.sheet{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));z-index:26;background:var(--card);border-radius:16px 16px 0 0;padding:12px 12px 14px;direction:rtl;max-height:min(62vh,440px);overflow:auto;box-shadow:0 -8px 32px #000a;font-family:'Assistant',sans-serif}
.sheet h3{margin:0 0 8px;font-size:16px}
.sheet .srow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.sheet input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;background:#12151b;border:1px solid #3a4150;border-radius:8px;color:var(--fg);padding:7px 10px}
.sheet input.warn{box-shadow:inset 0 0 0 1px #ff9f43}
.sheet .slabel{font-size:12px;color:var(--mut);margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.chip{font:inherit;font-size:12px;background:#20242d;border:1px solid #3a4150;border-radius:16px;color:var(--fg);padding:5px 8px;display:inline-flex;align-items:center;gap:3px;line-height:1.2}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:800}
.sheet .sactions{display:flex;gap:8px;justify-content:flex-start}
.sheet .sactions .ok{background:var(--acc);color:#111;font:inherit;font-weight:800;border:0;border-radius:8px;padding:8px 14px}
.sheet .sactions .cancel{background:#262b35;color:var(--fg);font:inherit;border:0;border-radius:8px;padding:8px 14px}
.tok .fx{display:inline-block}
.tok .fx-shake{animation:fx-shake .32s ease-in-out infinite}
@keyframes fx-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px) rotate(-2deg)}75%{transform:translateX(2px) rotate(2deg)}}
.tok .fx-whisper{opacity:.55;transform:scale(.82);transform-origin:center}
.tok .fx-pop{animation:fx-pop .5s ease-out}
@keyframes fx-pop{0%{transform:scale(.7);opacity:.6}45%{transform:scale(1.55);opacity:1}100%{transform:scale(1)}}
.tok .fx-strike{text-decoration:line-through;text-decoration-thickness:2px}
.tok .fx-repl{margin-inline-start:.35em;text-decoration:none;opacity:.95}
.tok .fx-morph .from{animation:fx-morph-out .45s ease-in forwards}
.tok .fx-morph .to{animation:fx-morph-in .45s ease-out forwards;margin-inline-start:.15em}
@keyframes fx-morph-out{to{opacity:.35;transform:scale(.92)}}
@keyframes fx-morph-in{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:scale(1)}}
.tok .hid{opacity:.4}
.tok .hid-hi{opacity:1;color:#7ecbff}
.tok.on .hid-hi{color:#9ad8ff}

</style>
</head>
<body>
<header id="hdr">
  <h1 id="title">עורך כתוביות</h1>
  <span id="status" class="status">טוען…</span>
  <button class="hbtn icon" id="cutmode" aria-label="מצב עריכת חיתוכים" title="מצב עריכת חיתוכים" aria-pressed="false">✂️</button>
  <button class="hbtn" id="undo" title="ביטול פעולה אחרונה">↶ בטל</button>
  <button class="hbtn" id="export">ייצוא JSON</button>
  <button class="hbtn submit" id="submit">הגש</button>
</header>
<div class="help">לחיצה על <b>מילה</b> או <b>שורה</b> מעבירה · לחיצה ארוכה עורכת טקסט ואפקט · <b>B</b> סימון הדגשה · <b>↵</b> פיצול · <b>×</b> חיבור · <b>💬</b> הערה · <b>✂️</b> חיתוך · כל שינוי נשמר</div>
<div id="lines"></div>
<div class="vwrap" id="vwrap"><video id="v" playsinline preload="metadata"></video><div class="sub" id="sub"></div><button class="vbig" id="vbig" aria-label="הגדלת הווידאו">⤢</button></div>
<div class="player" id="player">
  <button class="ib" id="back" aria-label="5 שניות אחורה">−5</button>
  <button class="ib main" id="play" aria-label="נגן / עצור">▶</button>
  <button class="ib" id="fwd" aria-label="5 שניות קדימה">+5</button>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="התקדמות">
  <span class="time" id="time">0:00 / 0:00</span>
  <button class="speed" id="speed" data-rate="1" aria-label="מהירות ניגון 1×" title="מהירות ניגון">1×</button>
  <button class="ib on" id="tapmode" aria-label="לחיצה מנגנת" title="לחיצה מנגנת" aria-pressed="true">▶</button>
  <button class="ib" id="size" aria-label="הצגת וידאו" title="הצג / הסתר וידאו">🎬</button>
  <button class="ib on" id="follow" aria-label="גלילה עם השיר" title="גלילה עם השיר">⇣</button>
</div>
<script>
const SB_URL='https://azfjddzvnxubtmihbynj.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6ZmpkZHp2bnh1YnRtaWhieW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzY4NjYsImV4cCI6MjEwNzA1Mjg2Nn0.mfGd4WLNiNh-mhpgCX2MjmzxOQIfWESS8CUGjYbB8FQ';
const PROJECT=new URLSearchParams(location.search).get('project')||'amitai-part';
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
const RATES=[1,1.5,2,2.5];
const $=id=>document.getElementById(id);
const v=$('v'),linesEl=$('lines'),statusEl=$('status');
let words=[],breaks=new Set(),bold=new Set(),notes={},wordCuts=[],cutBreaks=new Set(),silences=new Set(),wordEdits={},effects={};
let undoStack=[],saveTimer=null,saving=false,queued=false;
let dirtyFlags={layout:false,notes:false,cuts:false,silences:false,edits:false,effects:false};
let nowId=null,nowOff=0,unitEls={},partEls={},unitsCache=[],linesCache=[];
let songTitle='',performerName='',waNumber='';
let cutMode=false,playOnTap=true,snackTimer=null,lpTimer=null,lpOpened=false,lpStart=null,suppressSeek=false;

function setStatus(t,err){statusEl.textContent=t;statusEl.classList.toggle('err',!!err)}
function fmt(t){if(!isFinite(t))t=0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
function lastWordIdx(){return Math.max(0,words.length-1)}
function hasOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function cloneNotes(n){try{return JSON.parse(JSON.stringify(n||{}))}catch(e){return {}}}
function parseId(val){return (val!=null && /^-?\d+$/.test(String(val)))?+val:val}
function sortMixed(arr){return [...arr].sort((a,b)=>{const ap=String(a).split(/[.:]/).map(Number),bp=String(b).split(/[.:]/).map(Number);for(let i=0;i<Math.max(ap.length,bp.length);i++){const d=(ap[i]||0)-(bp[i]||0);if(d)return d}return 0})}
const FLAG_KEYS=['layout','notes','cuts','silences','edits','effects'];
function emptyFlags(){const o={};FLAG_KEYS.forEach(k=>o[k]=false);return o}
function anyDirty(f){return FLAG_KEYS.some(k=>f[k])}
function restoreFlags(flags){FLAG_KEYS.forEach(k=>{if(flags[k])dirtyFlags[k]=true})}
function cloneObj(n){try{return JSON.parse(JSON.stringify(n||{}))}catch(e){return {}}}
const FX=[
  {type:'none',icon:'○',label:'ללא',need:false,field:''},
  {type:'hidden',icon:'🔍',label:'מילה חבויה',need:'letters',field:'אילו אותיות'},
  {type:'morph',icon:'🔄',label:'מילה מתחלפת',need:'required',field:'משתנה ל…'},
  {type:'strike',icon:'✂️',label:'מחיקה',need:'optional',field:'מוחלף ב…'},
  {type:'shake',icon:'〰️',label:'רעד',need:false,field:''},
  {type:'typewriter',icon:'⌨️',label:'הקלדה',need:false,field:''},
  {type:'whisper',icon:'🤫',label:'לחישה',need:false,field:''},
  {type:'pop',icon:'💥',label:'פיצוץ',need:false,field:''}
];
function fxMeta(type){return FX.find(x=>x.type===type)||FX[0]}
function effectOf(u){if(!u)return null;return effects[String(u.id)]||effects[String(u.orig)]||null}

function editString(i){const k=String(i);return hasOwn(wordEdits,k)?wordEdits[k]:(words[i]?words[i].w:'')}
function tokensOf(i){
  const has=hasOwn(wordEdits,String(i));
  const raw=has?wordEdits[String(i)]:(words[i]?words[i].w:'');
  if(has && raw==='')return [];
  if(!has)return [words[i]?words[i].w:''];
  const t=raw.trim();return t?t.split(/\s+/).filter(Boolean):[];
}
function splitTiming(s,e,tokens){
  const lens=tokens.map(t=>[...t].length);
  const total=Math.max(1,lens.reduce((a,b)=>a+b,0)),dur=e-s;
  let acc=0;
  return tokens.map((t,k)=>{const start=s+(acc/total)*dur;acc+=lens[k];return {text:t,s:start,e:s+(acc/total)*dur}});
}
function getUnits(){
  const out=[];
  for(let i=0;i<words.length;i++){
    const orig=words[i], has=hasOwn(wordEdits,String(i)), raw=has?wordEdits[String(i)]:orig.w;
    if(has && raw===''){out.push({orig:i,sub:null,id:i,text:'',s:orig.s,e:orig.e,hidden:true,edited:true,lastSub:true,nsub:0});continue}
    const toks=tokensOf(i);
    if(!has || toks.length<=1){
      const t=has?(toks[0]||raw):orig.w;
      out.push({orig:i,sub:null,id:i,text:t,s:orig.s,e:orig.e,hidden:false,edited:!!has,lastSub:true,nsub:1});
    }else{

function highlightLetters(text, which){
  const chars=[...text], marks=new Array(chars.length).fill(false);
  const w=(which||'').trim();
  if(w){
    const range=/^(\d+)\s*-\s*(\d+)$/.exec(w);

    if(range){const a=Math.max(1,+range[1]),b=Math.min(chars.length,+range[2]);for(let i=a;i<=b;i++)marks[i-1]=true}
    else if(list){w.split(/[\s,]+/).filter(Boolean).forEach(n=>{const i=+n-1;if(i>=0&&i<chars.length)marks[i]=true})}

linesEl.addEventListener('click',e=>{
  const el=e.target.closest('button[data-act], .silence-row[data-act]');
  if(el){
    if(el.closest('.nmenu')||el.closest('.wedit'))return;
    const a=el.dataset.act,id=el.dataset.id,key=el.dataset.key;
    if(a==='seek'){
      if(suppressSeek||lpOpened){suppressSeek=false;lpOpened=false;return}
      const u=findUnit(id);if(!u)return;
      const off=el.dataset.off!=null?+el.dataset.off:0;

    }else if(a==='bold'){const u=findUnit(id);if(u)change(()=>toggleBold(u),'layout')}

      if(kind==='cut')change(()=>cutBreaks.delete(k),'cuts');
      else change(()=>breaks.delete(parseId(k)),'layout');

    else if(a==='addcut')change(()=>{const k=id+':'+el.dataset.off;if(!wordCuts.includes(k))wordCuts.push(k)},'cuts')
    else if(a==='cutline'){
      const k=id+':'+el.dataset.off;

  const line=e.target.closest('.line');if(!line)return;
  const u=findUnit(line.dataset.first);if(u)seekTo(u.s-0.05);
});

function clearLp(){clearTimeout(lpTimer);lpTimer=null;lpStart=null}
linesEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('.wedit,.nmenu'))return;
  const t=e.target.closest('[data-act="seek"]');if(!t)return;
  if(e.pointerType==='mouse' && e.button!==0)return;
  const u=findUnit(t.dataset.id);if(!u)return;
  lpOpened=false;suppressSeek=false;
  lpStart={x:e.clientX,y:e.clientY,u};
  lpTimer=setTimeout(()=>{lpTimer=null;lpOpened=true;suppressSeek=true;openWordEdit(u)},500);
});
linesEl.addEventListener('pointermove',e=>{if(!lpTimer||!lpStart)return;if(Math.hypot(e.clientX-lpStart.x,e.clientY-lpStart.y)>8)clearLp()});
linesEl.addEventListener('pointerup',clearLp);
linesEl.addEventListener('pointercancel',clearLp);
linesEl.addEventListener('contextmenu',e=>{if(e.target.closest('[data-act="seek"]'))e.preventDefault()});
document.addEventListener('click',e=>{if(!e.target.closest('.nmenu,.nbtn'))closeNoteMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('wsheet')){e.preventDefault();closeWordEdit()}});

$('cutmode').onclick=()=>{cutMode=!cutMode;$('cutmode').setAttribute('aria-pressed',cutMode?'true':'false');document.body.classList.toggle('cutmode',cutMode);render(true)};
$('undo').onclick=()=>{
  hideSnack();const s=undoStack.pop();if(!s)return;
  breaks=new Set(s.b);bold=new Set(s.o);notes=cloneNotes(s.n);wordCuts=[...s.c];cutBreaks=new Set(s.cb);silences=new Set(s.s);wordEdits={...s.e};effects=cloneObj(s.f);
  dirtyFlags={layout:true,notes:true,cuts:true,silences:true,edits:true,effects:true};render(true);queueSave();
};

function exportState(){
  const o={breaks:sortMixed(breaks),bold:sortMixed(bold)};
  if(Object.keys(notes).length)o.notes=cloneNotes(notes);
  if(wordCuts.length)o.wordCuts=sortMixed(wordCuts);
  if(cutBreaks.size)o.cutBreaks=sortMixed(cutBreaks);
  if(silences.size)o.silences=sortMixed(silences);
  if(Object.keys(wordEdits).length)o.wordEdits={...wordEdits};
  if(Object.keys(effects).length)o.effects=cloneObj(effects);
  return o;
}
function queueSave(){queued=true;setStatus('שומר…');clearTimeout(saveTimer);saveTimer=setTimeout(save,500)}
async function fetchRow(){
  const r=await fetch(`${SB_URL}/rest/v1/subtitle_projects?id=eq.${encodeURIComponent(PROJECT)}&select=state,updated_at`,{headers:H});
  if(!r.ok)throw new Error(r.status);
  const rows=await r.json();if(!rows.length)throw new Error('missing');
  return rows[0];
}
async function save(){
  if(saving){saveTimer=setTimeout(save,300);return}
  if(!anyDirty(dirtyFlags)){queued=false;return}
  saving=true;queued=false;
  const flags={...dirtyFlags};dirtyFlags=emptyFlags();
  try{
    const row=await fetchRow();
    const server=(row.state&&typeof row.state==='object')?{...row.state}:{};
    const merged={...server};
    if(flags.layout){merged.breaks=sortMixed(breaks);merged.bold=sortMixed(bold)}
    if(flags.notes){if(Object.keys(notes).length)merged.notes=cloneNotes(notes);else delete merged.notes}
    if(flags.cuts){
      if(wordCuts.length)merged.wordCuts=sortMixed(wordCuts);else delete merged.wordCuts;
      if(cutBreaks.size)merged.cutBreaks=sortMixed(cutBreaks);else delete merged.cutBreaks;
      delete merged.cuts;
    }
    if(flags.silences){if(silences.size)merged.silences=sortMixed(silences);else delete merged.silences}
    if(flags.edits){if(Object.keys(wordEdits).length)merged.wordEdits={...wordEdits};else delete merged.wordEdits}
    if(flags.effects){if(Object.keys(effects).length)merged.effects=cloneObj(effects);else delete merged.effects}
    const body=JSON.stringify({state:merged,updated_at:new Date().toISOString()});
    try{localStorage.setItem('subs-'+PROJECT,body)}catch(e){}
    const url=`${SB_URL}/rest/v1/subtitle_projects?id=eq.${encodeURIComponent(PROJECT)}`+(row.updated_at?`&updated_at=eq.${encodeURIComponent(row.updated_at)}`:'');
    const r=await fetch(url,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body});
    if(!r.ok)throw new Error(r.status);
    const out=await r.json();
    if(!out.length){restoreFlags(flags);saving=false;return save()}
    let needRender=false;
    if(!flags.layout && !dirtyFlags.layout){if(Array.isArray(server.breaks))breaks=new Set(server.breaks);if(Array.isArray(server.bold))bold=new Set(server.bold);if(words.length)breaks.add(lastWordIdx());needRender=true}
    if(!flags.notes && !dirtyFlags.notes){notes=(server.notes&&typeof server.notes==='object'&&!Array.isArray(server.notes))?cloneNotes(server.notes):{};needRender=true}
    if(!flags.cuts && !dirtyFlags.cuts){wordCuts=Array.isArray(server.wordCuts)?[...server.wordCuts]:(Array.isArray(server.cuts)?[...server.cuts]:[]);cutBreaks=new Set(Array.isArray(server.cutBreaks)?server.cutBreaks:[]);needRender=true}
    if(!flags.silences && !dirtyFlags.silences){silences=new Set(Array.isArray(server.silences)?server.silences:[]);needRender=true}
    if(!flags.edits && !dirtyFlags.edits){wordEdits=(server.wordEdits&&typeof server.wordEdits==='object'&&!Array.isArray(server.wordEdits))?{...server.wordEdits}:{};needRender=true}
    if(!flags.effects && !dirtyFlags.effects){effects=(server.effects&&typeof server.effects==='object'&&!Array.isArray(server.effects))?cloneObj(server.effects):{};needRender=true}
    if(needRender && !anyDirty(dirtyFlags))render(true);
    if(!queued && !anyDirty(dirtyFlags))setStatus('נשמר ✓');
  }catch(e){
    restoreFlags(flags);
    setStatus('שגיאה בשמירה, מנסה שוב…',true);queued=true;saveTimer=setTimeout(save,3000);
  }
  saving=false;
  if(queued||anyDirty(dirtyFlags))saveTimer=setTimeout(save,300);
}
window.addEventListener('beforeunload',e=>{if(queued||anyDirty(dirtyFlags)){e.preventDefault();e.returnValue=''}});

$('export').onclick=()=>{
  const st=exportState(),pack=getLines(),cues=[];
  pack.lines.forEach(ln=>{
    const segs=ln.items.filter(it=>!it.u.hidden).map(it=>({text:it.pt.text,start:it.pt.s,end:it.pt.e,bold:isBold(it.u),id:it.u.id,off:it.pt.off}));
    if(!segs.length)return;
    cues.push({start:segs[0].start,end:segs[segs.length-1].end,text:segs.map(x=>x.text).join(' '),words:segs,silenceAfter:silences.has(String(ln.key)),note:notes[String(ln.key)]||null});
  });
  const blob=new Blob([JSON.stringify({project:PROJECT,exported_at:new Date().toISOString(),state:st,cues},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=PROJECT+'-subtitles.json';document.body.appendChild(a);a.click();a.remove();
};

function submitMessage(){return 'היי, סיימתי לערוך את הכתוביות של השיר '+songTitle+' של '+performerName+', תוכל לשלוח לי סרטון בבקשה? (פרויקט: '+PROJECT+')'}
function submitUrl(){
  const digits=String(waNumber||'').replace(/[^\d]/g,'');
  const base=digits?'https://wa.me/'+digits:'https://wa.me/';
  return base+'?text='+encodeURIComponent(submitMessage());
}
function closeModal(){const m=$('modal');if(m)m.remove()}
$('submit').onclick=()=>{
  closeModal();
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='modal';
  const box=document.createElement('div');box.className='modal';
  const h=document.createElement('h2');h.textContent='הגשת העריכה';
  const p=document.createElement('p');p.textContent='תיפתח הודעת WhatsApp מוכנה לשליחה:';
  const pre=document.createElement('div');pre.className='preview';pre.textContent=submitMessage();
  const actions=document.createElement('div');actions.className='actions';
  const ok=document.createElement('button');ok.className='ok';ok.textContent='פתח WhatsApp';
  const cancel=document.createElement('button');cancel.className='cancel';cancel.textContent='ביטול';
  cancel.onclick=closeModal;
  bg.addEventListener('click',ev=>{if(ev.target===bg)closeModal()});
  ok.onclick=()=>{
    const a=document.createElement('a');a.href=submitUrl();a.target='_blank';a.rel='noopener';
    document.body.appendChild(a);a.click();a.remove();
    closeModal();setStatus('נפתח WhatsApp לשליחה');
  };
  actions.append(ok,cancel);box.append(h,p,pre,actions);bg.appendChild(box);document.body.appendChild(bg);
};

function rateLabel(r){return r+'×'}
function applyRate(r){
  if(!RATES.includes(r))r=1;
  v.playbackRate=r;v.preservesPitch=true;
  try{v.mozPreservesPitch=true}catch(e){}
  try{v.webkitPreservesPitch=true}catch(e){}
  $('speed').textContent=rateLabel(r);$('speed').dataset.rate=String(r);
  $('speed').setAttribute('aria-label','מהירות ניגון '+rateLabel(r));
  try{localStorage.setItem('subs-speed',String(r))}catch(e){}
}
function loadRate(){let r=parseFloat(localStorage.getItem('subs-speed'));if(!RATES.includes(r))r=1;applyRate(r)}
$('speed').onclick=()=>{const cur=RATES.includes(v.playbackRate)?v.playbackRate:1;applyRate(RATES[(RATES.indexOf(cur)+1)%RATES.length])};
function setTapMode(on){
  playOnTap=!!on;
  $('tapmode').classList.toggle('on',playOnTap);
  $('tapmode').setAttribute('aria-pressed',playOnTap?'true':'false');
  $('tapmode').setAttribute('aria-label',playOnTap?'לחיצה מנגנת':'לחיצה מעבירה בלבד');
  $('tapmode').title=playOnTap?'לחיצה מנגנת':'לחיצה מעבירה בלבד';
  $('tapmode').textContent=playOnTap?'▶':'⇥';
  try{localStorage.setItem('subs-playOnTap',playOnTap?'1':'0')}catch(e){}
}
$('tapmode').onclick=()=>setTapMode(!playOnTap);
try{if(localStorage.getItem('subs-playOnTap')==='0')setTapMode(false)}catch(e){}

$('play').onclick=()=>v.paused?v.play():v.pause();
$('back').onclick=()=>{v.currentTime=Math.max(0,v.currentTime-5)};
$('fwd').onclick=()=>{v.currentTime=Math.min(v.duration||1e9,v.currentTime+5)};
$('size').onclick=()=>{const w=$('vwrap');w.classList.toggle('show');$('size').classList.toggle('on',w.classList.contains('show'));layoutChrome()};
$('vbig').onclick=()=>{$('vwrap').classList.toggle('big');layoutChrome()};
let follow=true;$('follow').onclick=()=>{follow=!follow;$('follow').classList.toggle('on',follow)};
v.addEventListener('play',()=>$('play').textContent='❚❚');
v.addEventListener('pause',()=>$('play').textContent='▶');
let seeking=false;
$('seek').addEventListener('input',()=>{seeking=true;if(v.duration)v.currentTime=$('seek').value/1000*v.duration});
$('seek').addEventListener('change',()=>{seeking=false});

function updateSung(t){
  for(const u of unitsCache){
    const marked=isBold(u);
    const pts=partTimes(u);
    let any=false;
    pts.forEach(pt=>{
      const started=marked && t+0.02>=pt.s;
      if(started)any=true;
      const pe=partEls[u.id+':'+pt.off];
      if(pe){const part=pe.classList&&pe.classList.contains('part')?pe:(pe.closest?pe.closest('.part')||pe:pe);if(part&&part.classList)part.classList.toggle('sung',started)}
    });
    const we=unitEls[u.id];if(we)we.classList.toggle('sung',any);
  }
}
function findAt(t){
  const units=unitsCache;if(!units.length)return {u:null,pt:null};
  let u=null;
  for(let i=0;i<units.length;i++){if(units[i].s<=t+0.02)u=units[i];else break}
  if(!u)return {u:null,pt:null};
  const pts=partTimes(u);let pt=pts[0];
  for(const p of pts){if(p.s<=t+0.02)pt=p}
  return {u,pt};
}
function tick(force){
  const t=v.currentTime||0;
  if(!seeking&&v.duration)$('seek').value=Math.round(t/v.duration*1000);
  $('time').textContent=fmt(t)+' / '+fmt(v.duration);
  const {u,pt}=findAt(t);
  const id=u?u.id:null, off=pt?pt.off:0;
  if(id!==nowId || off!==nowOff || force){
    document.querySelectorAll('.w.now,.part.now,.line.cur').forEach(el=>el.classList.remove('now','cur'));
    nowId=id;nowOff=off;
    if(u){
      const we=unitEls[u.id];if(we){we.classList.add('now');const ln=we.closest('.line');if(ln)ln.classList.add('cur')}
      const pe=partEls[u.id+':'+off];if(pe){const part=pe.classList&&pe.classList.contains('part')?pe:(pe.closest?pe.closest('.part')||pe:pe);part.classList.add('now')}
      if(follow&&!v.paused&&we){const r=we.getBoundingClientRect(),bottom=window.innerHeight-$('player').offsetHeight;if(r.top<60||r.bottom>bottom-10)we.scrollIntoView({block:'center',behavior:'smooth'})}
    }
    updateSung(t);
    renderSub(u,pt,t);
  }
}
function lineOf(u,pt){
  for(const ln of linesCache){
    if(ln.items.some(it=>it.u.id===u.id && it.pt.off===(pt?pt.off:0)))return ln;
  }
  return null;
}
function renderSub(u,pt,t){
  const sub=$('sub');if(!u||u.hidden){sub.textContent='';return}
  const ln=lineOf(u,pt);if(!ln){sub.textContent='';return}
  if(t>(ln.items[ln.items.length-1].pt.e)+0.8){sub.textContent='';return}
  let html='';
  ln.items.forEach((it,i)=>{
    if(it.u.hidden||!it.pt.text)return;
    const sameWord=i>0&&ln.items[i-1].u.id===it.u.id;
    if(html && !sameWord)html+=' ';
    const on=u&&it.u.id===u.id && pt && it.pt.off===pt.off;
    const fx=effectOf(it.u);
    const typ=fx&&fx.type&&fx.type!=='none'?fx.type:'';
    let inner=esc(it.pt.text);
    if(typ==='hidden') inner=highlightLetters(it.pt.text, fx.text2||'');
    else if(typ==='typewriter') inner=typewriterHtml(it.pt.text,it.u,t,on);
    else if(typ==='morph' && fx.text2){
      if(on) inner='<span class="from">'+esc(it.pt.text)+'</span><span class="to">'+esc(fx.text2)+'</span>';
      else inner=esc(it.pt.text);
    }else if(typ==='strike'){
      inner=esc(it.pt.text)+(fx.text2?'<span class="fx-repl">'+esc(fx.text2)+'</span>':'');
    }
    const fxCls=typ?' fx fx-'+typ:'';
    const started=t+0.02>=it.pt.s;
    html+='<span class="tok'+(on?' on':'')+(isBold(it.u)&&started?' b':'')+'"><span class="'+(fxCls||'fx')+'">'+inner+'</span></span>';
  });
  sub.innerHTML=html;
}
(function loop(){if(!v.paused)tick();requestAnimationFrame(loop)})();
v.addEventListener('timeupdate',()=>tick());
v.addEventListener('seeked',()=>tick());
v.addEventListener('loadedmetadata',()=>{loadRate();tick(true);layoutChrome()});
window.addEventListener('resize',layoutChrome);
loadRate();
load();
</script>
