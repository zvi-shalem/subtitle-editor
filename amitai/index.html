<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אמתי שלם</title>
<meta name="description" content="אמתי שלם — הופעות, ספוקן ומילים. צפו בסרטונים ביוטיוב.">
<meta name="theme-color" content="#070506">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="אמתי שלם">
<meta property="og:description" content="הופעות · ספוקן · מילים">
<meta property="og:url" content="https://zvi-shalem.github.io/subtitle-editor/amitai/">
<meta property="og:image" content="https://zvi-shalem.github.io/subtitle-editor/amitai/assets/avatar.jpg">
<meta property="og:image:alt" content="אמתי שלם">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="אמתי שלם">
<meta name="twitter:description" content="הופעות · ספוקן · מילים">
<meta name="twitter:image" content="https://zvi-shalem.github.io/subtitle-editor/amitai/assets/avatar.jpg">
<link rel="canonical" href="https://zvi-shalem.github.io/subtitle-editor/amitai/">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/heebo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/avatar.webp" as="image" type="image/webp">
<link rel="preload" href="assets/hene-hem.webp" as="image" type="image/webp">
<style>
@font-face {
  font-family: Heebo;
  src: url("assets/fonts/heebo.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #070506;
  --ink: #f6f0ea;
  --muted: rgba(246, 240, 234, .58);
  --quiet: rgba(246, 240, 234, .38);
  --red: #d42b36;
  --red-deep: #9a1822;
  --ring: #e8c4b0;
  --card: #140e10;
  --line: rgba(246, 240, 234, .1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: Heebo, "Assistant", "Segoe UI", sans-serif;
  font-weight: 400;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; }
::selection { background: rgba(212, 43, 54, .45); color: #fff; }

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background:
    radial-gradient(820px 540px at 50% -6%, rgba(132, 16, 26, .55), transparent 58%),
    radial-gradient(420px 320px at 50% 12%, rgba(90, 12, 18, .28), transparent 70%),
    var(--bg);
}
.atmosphere .orb {
  position: absolute;
  left: 50%;
  top: -12%;
  width: 28rem;
  height: 28rem;
  translate: -50% 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(180, 32, 44, .32) 0%, rgba(100, 12, 20, .1) 46%, transparent 70%);
  filter: blur(8px);
  animation: drift 18s ease-in-out infinite alternate;
}
.grain {
  position: fixed;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: .055;
  mix-blend-mode: overlay;
}

.page {
  position: relative;
  z-index: 2;
  width: min(26.75rem, 100%);
  margin: 0 auto;
  padding: calc(2.5rem + var(--safe-t)) 1.2rem calc(2.2rem + var(--safe-b));
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.avatar-wrap {
  position: relative;
  width: 8rem;
  height: 8rem;
  margin-bottom: 1.2rem;
  animation: rise .8s cubic-bezier(.22, 1, .36, 1) both;
  filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .5)) drop-shadow(0 0 32px rgba(180, 24, 36, .32));
}
.avatar-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(from 210deg, #f3d4c4, #e4454a 28%, #7a141c 58%, #efc7b4 82%, #f3d4c4);
  animation: spin 22s linear infinite;
}
.avatar-wrap picture, .avatar-wrap img {
  position: absolute;
  inset: 5px;
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  border-radius: 50%;
  object-fit: cover;
  background: #1a1012;
  box-shadow: 0 0 0 3px var(--bg);
}
.hero h1 {
  font-weight: 800;
  font-size: 2.15rem;
  line-height: 1.15;
  letter-spacing: -.03em;
  color: var(--ink);
  text-shadow: 0 2px 24px rgba(0, 0, 0, .35);
  animation: rise .8s .08s cubic-bezier(.22, 1, .36, 1) both;
}
.tagline {
  margin-top: .55rem;
  font-weight: 500;
  font-size: .82rem;
  letter-spacing: .08em;
  color: var(--muted);
  animation: rise .8s .16s cubic-bezier(.22, 1, .36, 1) both;
}
.tagline .dot {
  display: inline-block;
  margin: 0 .15em;
  color: #c94a52;
  letter-spacing: 0;
}
.flourish {
  display: block;
  position: relative;
  width: .34rem;
  height: .34rem;
  margin: 1.25rem auto 0;
  border-radius: 50%;
  background: #d42b36;
  box-shadow: 0 0 10px rgba(212, 43, 54, .7);
}
.flourish::before,
.flourish::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 1.2rem;
  height: 1px;
  background: rgba(246, 240, 234, .5);
  border-radius: 1px;
}
.flourish::before { right: calc(100% + .4rem); }
.flourish::after { left: calc(100% + .4rem);
  animation: rise .8s .22s cubic-bezier(.22, 1, .36, 1) both;
}

.videos {
  margin-top: 2.15rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.card {
  display: block;
  position: relative;
  border-radius: 1.35rem;
  background: var(--card);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, .07) inset,
    0 16px 40px rgba(0, 0, 0, .42),
    0 0 0 1px rgba(255, 255, 255, .05);
}
.card--featured {
  box-shadow:
    0 1px 0 rgba(255, 255, 255, .09) inset,
    0 20px 48px rgba(0, 0, 0, .5),
    0 0 0 1px rgba(255, 255, 255, .07),
    0 16px 56px rgba(154, 24, 34, .28);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transform: translateZ(0);
  transition: transform .4s cubic-bezier(.22, 1, .36, 1), box-shadow .4s ease;
  animation: rise .85s cubic-bezier(.22, 1, .36, 1) both;
  animation-delay: calc(.3s + var(--i, 0) * .1s);
}
@media (hover: hover) and (pointer: fine) {
  .card:hover {
    transform: translateY(-5px);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .1) inset,
      0 22px 50px rgba(0, 0, 0, .5),
      0 0 0 1px rgba(212, 43, 54, .38),
      0 10px 36px rgba(180, 24, 36, .22);
  }
  .card:hover .play-btn { transform: scale(1.08); background: rgba(20, 8, 10, .55); }
}
.card:active {
  transform: translateY(-1px) scale(.985);
}

.thumb {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #2a1014;
  overflow: hidden;
}
.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
}
.card--featured .thumb { aspect-ratio: 4 / 3; }
.thumb-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 62%, rgba(8, 4, 5, .28) 80%, rgba(8, 4, 5, .72) 100%);
  pointer-events: none;
}

.play {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  width: 4.35rem;
  height: 4.35rem;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.play-pulse {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid rgba(246, 240, 234, .45);
  animation: pulse 2.6s ease-out infinite;
}
.play-pulse--late { animation-delay: 1.3s; }
.play-btn {
  position: relative;
  z-index: 1;
  width: 3.35rem;
  height: 3.35rem;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  background: rgba(14, 6, 8, .58);
  border: 1px solid rgba(255, 255, 255, .4);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .18);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: transform .35s cubic-bezier(.22, 1, .36, 1), background .3s;
}
.play-btn svg {
  width: 1.2rem;
  height: 1.2rem;
  margin-inline-start: .12rem;
}
.card:not(.card--featured) .play { width: 3.4rem; height: 3.4rem; top: 50%; }
.card:not(.card--featured) .play-btn { width: 2.55rem; height: 2.55rem; }
.card:not(.card--featured) .play-btn svg { width: 1rem; height: 1rem; }

.badge {
  position: absolute;
  top: .8rem;
  left: .8rem;
  z-index: 2;
  padding: .28rem .62rem .26rem;
  border-radius: 999px;
  background: rgba(154, 24, 34, .92);
  border: 1px solid rgba(255, 255, 255, .14);
  color: #fff;
  font-weight: 700;
  font-size: .68rem;
  letter-spacing: .06em;
  line-height: 1;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .28);
}
.card-title {
  position: absolute;
  right: 1.2rem;
  left: 1.2rem;
  bottom: 1.1rem;
  z-index: 2;
  font-weight: 800;
  font-size: 1.7rem;
  letter-spacing: -.02em;
  line-height: 1.2;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .55);
}
.meta {
  padding: .85rem 1.05rem 1rem;
}
.meta h3 {
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: -.01em;
}

.channel {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  margin-top: 1.25rem;
  height: 3.15rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, .03);
  border: 1px solid var(--line);
  color: var(--ink);
  font-weight: 600;
  font-size: .95rem;
  letter-spacing: .01em;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background .25s, border-color .25s, transform .25s, box-shadow .25s;
  animation: rise .85s .45s cubic-bezier(.22, 1, .36, 1) both;
}
.channel svg { width: 1.25rem; height: 1.25rem; flex: none; color: #ff3d3d; }
@media (hover: hover) and (pointer: fine) {
  .channel:hover {
    background: rgba(212, 43, 54, .12);
    border-color: rgba(212, 43, 54, .45);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    transform: translateY(-2px);
  }
}
.channel:active { transform: scale(.985); }

.toast {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: calc(1.4rem + env(safe-area-inset-bottom, 0px));
  translate: -50% 120%;
  opacity: 0;
  padding: .7rem 1.15rem;
  border-radius: 999px;
  background: rgba(20, 12, 14, .92);
  border: 1px solid rgba(255, 255, 255, .1);
  color: var(--ink);
  font-weight: 600;
  font-size: .88rem;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  pointer-events: none;
  transition: translate .4s cubic-bezier(.22, 1, .36, 1), opacity .4s;
  white-space: nowrap;
}
.toast.is-on { translate: -50% 0; opacity: 1; }

@keyframes rise {
  from { opacity: 0; transform: translateY(1.15rem); }
  to { opacity: 1; transform: none; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drift {
  from { transform: translate3d(-6%, 0, 0) scale(1); }
  to { transform: translate3d(8%, 10%, 0) scale(1.12); }
}
@keyframes pulse {
  0% { transform: scale(1); opacity: .55; }
  100% { transform: scale(1.7); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .atmosphere .orb, .avatar-ring, .play-pulse, .hero > *, .card, .channel, .flourish {
    animation: none !important;
  }
  .card, .channel { transition: none; }
}

@media (min-width: 480px) {
  .hero h1 { font-size: 2.35rem; }
  .avatar-wrap { width: 8.5rem; height: 8.5rem; }
}
</style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"><div class="orb"></div></div>
  <svg class="grain" aria-hidden="true">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#grain)"></rect>
  </svg>

  <main class="page">
    <header class="hero">
      <div class="avatar-wrap">
        <div class="avatar-ring" aria-hidden="true"></div>
        <picture>
          <source srcset="assets/avatar.webp" type="image/webp">
          <img src="assets/avatar.jpg" width="160" height="160" alt="אמתי שלם" decoding="async">
        </picture>
      </div>
      <h1>אמתי שלם</h1>
      <p class="tagline">הופעות <span class="dot">·</span> ספוקן <span class="dot">·</span> מילים</p>
      <span class="flourish" aria-hidden="true"></span>
    </header>

    <section class="videos" id="videos" aria-label="סרטונים"></section>

    <a class="channel" id="channel" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8zM9.6 15.6V8.4L15.8 12l-6.2 3.6z"/></svg>
      <span>הערוץ ביוטיוב</span>
    </a>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  /* ── עריכה קלה: הוסיפו סרטונים כאן ─────────────────────────
     title       כותרת הכרטיס
     youtubeUrl  קישור ליוטיוב. אם ריק או '#', הכרטיס מסומן כבקרוב
     thumb       תמונה מקומית (אופציונלי). אם ריקה ו־youtubeUrl תקין,
                 תילקח אוטומטית תמונה מ־img.youtube.com
     badge       תוית קטנה, למשל 'בקרוב' או 'חדש'
     featured    true = כרטיס גדול בראש העמוד
  ─────────────────────────────────────────────────────────── */
  const CHANNEL_URL = '#'; // קישור לערוץ היוטיוב, כשיהיה

  const VIDEOS = [
    {
      title: 'הנה הם',
      youtubeUrl: '#',
      thumb: 'assets/hene-hem.webp',
      badge: 'בקרוב',
      featured: true,
    },
  ];

  const YT_ID = /(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/;

  function youtubeId(url) {
    const m = String(url || '').match(YT_ID);
    return m ? m[1] : '';
  }
  function isYoutube(url) {
    return !!youtubeId(url);
  }
  function thumbOf(v) {
    if (v.thumb) return v.thumb;
    const id = youtubeId(v.youtubeUrl);
    return id ? ('https://img.youtube.com/vi/' + id + '/maxresdefault.jpg') : '';
  }
  function jpgFallback(src) {
    return src && src.endsWith('.webp') ? src.replace(/\.webp$/, '.jpg') : '';
  }

  const playSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.3 6.2v11.6L18.5 12 8.3 6.2z"/></svg>';

  function cardHTML(v, i) {
    const featured = !!v.featured;
    const src = thumbOf(v);
    const jpg = jpgFallback(src);
    const soon = !isYoutube(v.youtubeUrl);
    const href = soon ? '#' : v.youtubeUrl;
    const badge = v.badge || (soon ? 'בקרוב' : '');
    const img = src ? (
      '<picture>' +
        (src.endsWith('.webp') ? '<source srcset="' + src + '" type="image/webp">' : '') +
        '<img src="' + (jpg || src) + '" alt="' + escapeHtml(v.title) + ' — אמתי שלם" width="960" height="720" decoding="async">' +
      '</picture>'
    ) : '';
    const titleEl = featured
      ? '<h2 class="card-title">' + escapeHtml(v.title) + '</h2>'
      : '<div class="meta"><h3>' + escapeHtml(v.title) + '</h3></div>';
    const label = escapeAttr(v.title) + (soon ? ' — בקרוב ביוטיוב' : '');
    return (
      '<a class="card' + (featured ? ' card--featured' : '') + (soon ? ' is-soon' : '') + '" style="--i:' + i + '" href="' + escapeAttr(href) + '"' +
        (soon ? ' aria-label="' + label + '"' : ' target="_blank" rel="noopener noreferrer"') + '>' +
        '<div class="thumb">' +
          img +
          '<div class="thumb-shade"></div>' +
          (badge ? '<span class="badge">' + escapeHtml(badge) + '</span>' : '') +
          '<div class="play"><span class="play-pulse"></span><span class="play-pulse play-pulse--late"></span><span class="play-btn">' + playSvg + '</span></div>' +
          (featured ? titleEl : '') +
        '</div>' +
        (featured ? '' : titleEl) +
      '</a>'
    );
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  const list = document.getElementById('videos');
  const ordered = [...VIDEOS].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  list.innerHTML = ordered.map(cardHTML).join('');

  const channel = document.getElementById('channel');
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 2400);
  }

  if (isYoutube(CHANNEL_URL)) {
    channel.href = CHANNEL_URL;
    channel.target = '_blank';
    channel.rel = 'noopener noreferrer';
  } else {
    channel.addEventListener('click', ev => {
      ev.preventDefault();
      toast('הערוץ יעלה בקרוב');
    });
  }

  list.addEventListener('click', ev => {
    const a = ev.target.closest('a.card');
    if (!a) return;
    if (a.classList.contains('is-soon') || a.getAttribute('href') === '#') {
      ev.preventDefault();
      toast('הסרטון יעלה בקרוב ביוטיוב');
    }
  });
  </script>
</body>
</html>
